<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LinaroWorks — щоденник робіт</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16324F" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<style>
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; margin:0; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  /* ---- Адаптивна ширина контейнера ---- */
  .app-shell { max-width: 448px; margin: 0 auto; }
  @media (min-width: 768px)  { .app-shell { max-width: 720px; } }
  @media (min-width: 1024px) { .app-shell { max-width: 960px; } }
  @media (min-width: 1440px) { .app-shell { max-width: 1180px; } }

  /* ---- Сітка карток на широких екранах ---- */
  .tickets-grid { display: block; }
  @media (min-width: 768px) {
    .tickets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 16px; align-items: start; }
  }
  @media (min-width: 1280px) {
    .tickets-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const APP_NAME = "LinaroWorks";
const BG = "#16324F", CARD = "#F4F0E8", INK = "#1A1A18", ORANGE = "#F26430", CYAN = "#7FB3D3";

const WORK_TYPES = ["Земляні роботи","Бетонні роботи","Мурування","Покрівля","Електрика","Сантехніка","Оздоблення","Демонтаж","Інше"];
const WORK_TYPE_LABELS = {
  "Земляні роботи": ["Земляні роботи","Zemní práce"],
  "Бетонні роботи": ["Бетонні роботи","Betonářské práce"],
  "Мурування": ["Мурування","Zdění"],
  "Покрівля": ["Покрівля","Střešní práce"],
  "Електрика": ["Електрика","Elektroinstalace"],
  "Сантехніка": ["Сантехніка","Instalatérské práce"],
  "Оздоблення": ["Оздоблення","Dokončovací práce"],
  "Демонтаж": ["Демонтаж","Demontáž"],
  "Інше": ["Інше","Jiné"],
};

const WEATHER = [["sun","☀️"],["cloud","☁️"],["rain","🌧️"],["snow","❄️"]];
const WEATHER_LABELS = { sun: ["Сонячно","Slunečno"], cloud: ["Хмарно","Zataženo"], rain: ["Дощ","Déšť"], snow: ["Сніг","Sníh"] };

const MONTHS = {
  uk: ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"],
  cs: ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"],
};
const MONTHS_NOM = {
  uk: ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"],
  cs: ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"],
};
const WEEKDAYS = {
  uk: ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"],
  cs: ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"],
};

const STRINGS = {
  appSubtitle: ["Щоденник робіт на об'єкті","Deník prací na stavbě"],
  emailPh: ["Email","Email"],
  firstNamePh: ["Ім'я","Jméno"],
  lastNamePh: ["Прізвище","Příjmení"],
  passwordPh: ["Пароль","Heslo"],
  signInBtn: ["УВІЙТИ","PŘIHLÁSIT SE"],
  signUpBtn: ["ЗАРЕЄСТРУВАТИСЯ","REGISTROVAT"],
  toggleToSignup: ["Немає акаунту? Зареєструватися","Nemáte účet? Zaregistrujte se"],
  toggleToSignin: ["Вже є акаунт? Увійти","Už máte účet? Přihlaste se"],
  fillEmailPass: ["Заповніть email і пароль.","Vyplňte email a heslo."],
  fillNames: ["Заповніть ім'я і прізвище.","Vyplňte jméno a příjmení."],
  loading: ["Завантаження...","Načítání..."],
  navToday: ["Сьогодні","Dnes"],
  navJournal: ["Журнал","Deník"],
  navHours: ["Години","Hodiny"],
  navPeople: ["Люди","Lidé"],
  roleForeman: ["бригадир","mistr"],
  roleWorker: ["робітник","dělník"],
  signOut: ["Вийти","Odhlásit"],
  newEntryTitle: ["НОВИЙ ЗАПИС","NOVÝ ZÁZNAM"],
  fieldDate: ["Дата","Datum"],
  fieldSite: ["Об'єкт / ділянка","Objekt / úsek"],
  sitePh: ["Напр. Корпус 2, 3-й поверх","Např. Budova 2, 3. patro"],
  fieldWeather: ["Погода","Počasí"],
  fieldWorkTypes: ["Види робіт","Druh prací"],
  fieldWorkers: ["Склад бригади","Složení čety"],
  workersPh: ["Напр. Іванов, Петренко + 3 підсобники","Např. Novák, Svoboda + 3 pomocníci"],
  fieldDescription: ["Що зроблено","Co bylo uděláno"],
  descPh: ["Опишіть обсяги та результат робіт за день...","Popište rozsah a výsledek prací za den..."],
  fillRequired: ["Заповніть об'єкт і опис виконаних робіт.","Vyplňte objekt a popis prací."],
  saveEntryBtn: ["ЗБЕРЕГТИ ЗАПИС","ULOŽIT ZÁZNAM"],
  savingBtn: ["ЗБЕРЕЖЕННЯ...","UKLÁDÁNÍ..."],
  emptyToday: ["Записів на сьогодні ще немає.","Dnes zatím žádné záznamy."],
  emptyJournal: ["Журнал поки порожній.","Deník je zatím prázdný."],
  emptyHours: ["Записів про години ще немає.","Zatím žádné záznamy o hodinách."],
  deleteEntryBtn: ["🗑 Видалити запис","🗑 Smazat záznam"],
  confirmDeleteEntry: ["Точно видалити цей запис? Це не можна скасувати.","Opravdu smazat tento záznam? Nelze vrátit zpět."],
  workersFallback: ["склад не вказано","složení neuvedeno"],
  addHoursBtn: ["+ ДОДАТИ ГОДИНИ","+ PŘIDAT HODINY"],
  searchPh: ["Пошук по імені...","Hledat podle jména..."],
  hoursFormTitle: ["ГОДИНИ РОБОТИ","PRACOVNÍ DOBA"],
  checkInLabel: ["Прихід","Příchod"],
  checkOutLabel: ["Вихід","Odchod"],
  lunchLabel: ["Була обідня перерва (−30 хв від годин)","Byla polední přestávka (−30 min)"],
  lunchLabelShort: ["Обідня перерва (−30 хв)","Polední přestávka (−30 min)"],
  fillDateInOut: ["Заповніть дату, прихід і вихід.","Vyplňte datum, příchod a odchod."],
  statusPending: ["очікує","čeká"],
  statusConfirmed: ["підтверджено","potvrzeno"],
  confirmBtn: ["Підтвердити","Potvrdit"],
  confirmDeleteHours: ["Точно видалити цей запис годин?","Opravdu smazat tento záznam o hodinách?"],
  togetherLabel: ["Разом","Celkem"],
  hUnit: ["год","h"],
  minUnit: ["хв","min"],
  adminYou: ["(ви)","(vy)"],
  adminMakeForeman: ["Зробити бригадиром","Udělat mistrem"],
  adminDemote: ["Понизити","Snížit"],
  loadingPeople: ["Завантаження списку людей...","Načítání seznamu lidí..."],
};

// ---- Стан мови (зберігається на пристрої) ----
let lang = localStorage.getItem("linaro-lang") || "uk";
function t(key) {
  const pair = STRINGS[key];
  if (!pair) return key;
  return lang === "cs" ? pair[1] : pair[0];
}
function tt(pair) { return lang === "cs" ? pair[1] : pair[0]; }

function setLang(l) {
  lang = l;
  localStorage.setItem("linaro-lang", l);
  render();
}

const todayISO = () => new Date().toISOString().slice(0,10);
const fmtLong = (iso) => { const d = new Date(iso+"T00:00:00"); return `${d.getDate()} ${MONTHS[lang][d.getMonth()]}, ${WEEKDAYS[lang][d.getDay()]}`; };
const fmtShort = (iso) => { const d = new Date(iso+"T00:00:00"); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`; };
const esc = (s) => (s||"").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function langToggleHTML(dark) {
  const color = dark ? CYAN : CYAN;
  return `<button id="langToggle" style="background:rgba(127,179,211,0.12);border:1px solid rgba(127,179,211,0.3);color:${color};font-size:11px;padding:5px 10px;border-radius:9999px;font-weight:600;letter-spacing:0.02em;">
    ${lang === "uk" ? "🇺🇦 UK" : "🇨🇿 CS"}
  </button>`;
}
function attachLangToggle() {
  const btn = document.getElementById("langToggle");
  if (btn) btn.onclick = () => setLang(lang === "uk" ? "cs" : "uk");
}

// ---- Перевірка конфігурації ----
const configured = window.SUPABASE_URL && window.SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
                    window.SUPABASE_ANON_KEY && window.SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";

const root = document.getElementById("root");

if (!configured) {
  root.innerHTML = `
    <div style="background:${BG};min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;font-family:sans-serif;">
      <div style="max-width:360px;">
        <h1 style="font-size:20px;margin-bottom:12px;">⚠️ Налаштування не завершено</h1>
        <p style="font-size:14px;opacity:0.8;line-height:1.5;">
          Файл <code>config.js</code> ще містить приклад-заповнювачі замість справжніх URL і ключа Supabase.
          Відкрий config.js і встав свої дані з розділу Settings → API у Supabase.
        </p>
      </div>
    </div>`;
  throw new Error("Not configured");
}

const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---- Стан застосунку ----
let state = {
  authChecked: false,
  user: null,
  role: null,
  fullName: null,
  loading: true,
  entries: [],
  profiles: [],
  timeEntries: [],
  view: "today",
  showForm: false,
  saving: false,
  error: null,
  formError: null,
  showHoursForm: false,
  hoursSaving: false,
  hoursFormError: null,
  hoursSearch: "",
  authMode: "signin",
  authError: null,
  authBusy: false,
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

const isForeman = () => state.role === "бригадир";
const displayName = () => state.fullName || state.user.email;

// ---- Auth ----
async function initAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    await loadProfile(session.user);
  } else {
    setState({ authChecked: true });
  }
  supabase.auth.onAuthStateChange((_event, session) => {
    if (session && session.user.id !== (state.user && state.user.id)) {
      loadProfile(session.user);
    } else if (!session) {
      setState({ user: null, role: null, entries: [], authChecked: true, view: "today" });
    }
  });
}

async function loadProfile(user) {
  const { data, error } = await supabase.from("profiles").select("role,email,full_name").eq("id", user.id).single();
  if (error) console.error("Profile load error:", error);
  setState({ user, role: (data && data.role) || "робітник", fullName: (data && data.full_name) || null, authChecked: true });
  loadEntries();
}

async function signIn(email, password) {
  setState({ authBusy: true, authError: null });
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { setState({ authBusy: false, authError: "Невірний email або пароль." }); return; }
  setState({ authBusy: false });
}

async function signUp(email, password, fullName) {
  setState({ authBusy: true, authError: null });
  const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
  if (error) { setState({ authBusy: false, authError: error.message }); return; }
  setState({ authBusy: false });
}

async function signOut() {
  await supabase.auth.signOut();
}

// ---- Робота з базою даних (записи) ----
async function loadEntries() {
  const { data, error } = await supabase.from("entries").select("*").order("date", { ascending:false }).order("created_at", { ascending:false });
  if (error) {
    console.error("Supabase error:", error);
    setState({ error: "Не вдалося завантажити записи: " + error.message, loading: false });
    return;
  }
  setState({ entries: data, loading: false, error: null });
}

async function saveEntry(formData) {
  setState({ saving: true, formError: null });
  const { error } = await supabase.from("entries").insert([{ ...formData, author: displayName() }]);
  if (error) {
    setState({ saving: false, formError: "Не вдалося зберегти запис. Спробуйте ще раз." });
    return;
  }
  setState({ saving: false, showForm: false });
  loadEntries();
}

async function deleteEntry(id) {
  const { error } = await supabase.from("entries").delete().eq("id", id);
  if (error) { alert("Не вдалося видалити запис: " + error.message); return; }
  loadEntries();
}

supabase.channel("entries-changes")
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "entries" }, () => { if (state.user) loadEntries(); })
  .on("postgres_changes", { event: "DELETE", schema: "public", table: "entries" }, () => { if (state.user) loadEntries(); })
  .subscribe();

// ---- Робота з базою даних (години) ----
async function loadTimeEntries() {
  const { data, error } = await supabase.from("time_entries").select("*").order("date", { ascending:false }).order("created_at", { ascending:false });
  if (error) { setState({ error: "Не вдалося завантажити години: " + error.message }); return; }
  setState({ timeEntries: data, error: null });
}

async function addTimeEntry(data) {
  setState({ hoursSaving: true, hoursFormError: null });
  const { error } = await supabase.from("time_entries").insert([{
    ...data, user_id: state.user.id, author_email: state.user.email, author_name: displayName(),
  }]);
  if (error) { setState({ hoursSaving: false, hoursFormError: "Не вдалося зберегти. Спробуйте ще раз." }); return; }
  setState({ hoursSaving: false, showHoursForm: false });
  loadTimeEntries();
}

async function updateTimeEntry(id, patch) {
  const { error } = await supabase.from("time_entries").update(patch).eq("id", id);
  if (error) { alert("Не вдалося оновити: " + error.message); return; }
  loadTimeEntries();
}

async function confirmTimeEntry(id) { updateTimeEntry(id, { status: "підтверджено" }); }

async function deleteTimeEntry(id) {
  const { error } = await supabase.from("time_entries").delete().eq("id", id);
  if (error) { alert("Не вдалося видалити: " + error.message); return; }
  loadTimeEntries();
}

function computeHoursMinutes(e) {
  const toMin = (t) => { const [h,m] = t.split(":").map(Number); return h*60+m; };
  let diff = toMin(e.check_out) - toMin(e.check_in);
  if (diff < 0) diff += 24*60;
  if (e.lunch_break) diff -= 30;
  return Math.max(diff, 0);
}
function minutesLabel(total) {
  const h = Math.floor(total/60), m = total%60;
  return `${h} ${t("hUnit")}${m ? " " + m + " " + t("minUnit") : ""}`;
}
function computeHoursLabel(e) { return minutesLabel(computeHoursMinutes(e)); }

supabase.channel("time-entries-changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "time_entries" }, () => { if (state.user) loadTimeEntries(); })
  .subscribe();

// ---- Робота з профілями (адмін-вкладка) ----
async function loadProfiles() {
  const { data, error } = await supabase.from("profiles").select("id,email,role,full_name").order("email");
  if (error) { setState({ error: "Не вдалося завантажити список людей: " + error.message }); return; }
  setState({ profiles: data, error: null });
}

async function setRole(id, role) {
  const { error } = await supabase.from("profiles").update({ role }).eq("id", id);
  if (error) { alert("Не вдалося змінити роль: " + error.message); return; }
  loadProfiles();
}

// ---- Рендер ----
function render() {
  if (!state.authChecked) return renderLoading();
  if (!state.user) return renderAuthGate();
  if (state.loading) return renderLoading();
  renderApp();
}

function renderLoading() {
  root.innerHTML = `<div style="background:${BG};min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="color:${CYAN};font-size:14px;" class="animate-pulse">${t("loading")}</div></div>`;
}

function renderAuthGate() {
  const isSignIn = state.authMode === "signin";
  root.innerHTML = `
    <div style="background:${BG};min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;">
      <div style="position:absolute;top:20px;right:20px;">${langToggleHTML()}</div>
      <div style="max-width:320px;width:100%;text-align:center;">
        <div style="width:64px;height:64px;border-radius:9999px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;background:rgba(242,100,48,0.15);font-size:28px;">👷</div>
        <h1 class="font-display" style="color:#fff;font-size:26px;letter-spacing:0.03em;margin-bottom:4px;">${APP_NAME}</h1>
        <p style="color:${CYAN};opacity:0.8;font-size:14px;margin-bottom:24px;">${t("appSubtitle")}</p>

        <input id="authEmail" type="email" placeholder="${t("emailPh")}" style="width:100%;padding:12px 16px;border-radius:8px;background:${CARD};color:${INK};border:none;outline:none;font-size:14px;margin-bottom:10px;box-sizing:border-box;" />
        ${!isSignIn ? `
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input id="authFirst" type="text" placeholder="${t("firstNamePh")}" style="flex:1;padding:12px 16px;border-radius:8px;background:${CARD};color:${INK};border:none;outline:none;font-size:14px;box-sizing:border-box;" />
          <input id="authLast" type="text" placeholder="${t("lastNamePh")}" style="flex:1;padding:12px 16px;border-radius:8px;background:${CARD};color:${INK};border:none;outline:none;font-size:14px;box-sizing:border-box;" />
        </div>` : ""}
        <input id="authPass" type="password" placeholder="${t("passwordPh")}" style="width:100%;padding:12px 16px;border-radius:8px;background:${CARD};color:${INK};border:none;outline:none;font-size:14px;margin-bottom:12px;box-sizing:border-box;" />

        ${state.authError ? `<div style="color:#ffb4b4;font-size:12px;margin-bottom:12px;">${esc(state.authError)}</div>` : ""}

        <button id="authSubmit" class="font-display" ${state.authBusy?"disabled":""} style="width:100%;padding:12px;border-radius:8px;background:${ORANGE};color:#fff;font-weight:600;letter-spacing:0.03em;border:none;font-size:14px;opacity:${state.authBusy?0.6:1};">
          ${state.authBusy ? "..." : (isSignIn ? t("signInBtn") : t("signUpBtn"))}
        </button>

        <button id="authToggle" style="margin-top:14px;background:none;border:none;color:${CYAN};opacity:0.8;font-size:13px;">
          ${isSignIn ? t("toggleToSignup") : t("toggleToSignin")}
        </button>
      </div>
    </div>`;

  attachLangToggle();
  const emailInput = document.getElementById("authEmail");
  const passInput = document.getElementById("authPass");
  const submit = () => {
    const email = emailInput.value.trim();
    const pass = passInput.value;
    if (!email || !pass) { setState({ authError: t("fillEmailPass") }); return; }
    if (isSignIn) {
      signIn(email, pass);
    } else {
      const first = document.getElementById("authFirst").value.trim();
      const last = document.getElementById("authLast").value.trim();
      if (!first || !last) { setState({ authError: t("fillNames") }); return; }
      signUp(email, pass, `${first} ${last}`);
    }
  };
  document.getElementById("authSubmit").onclick = submit;
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  document.getElementById("authToggle").onclick = () => setState({ authMode: isSignIn ? "signup" : "signin", authError: null });
}

function ticketHTML(e) {
  const w = WEATHER.find(x => x[0] === e.weather);
  const rot = e.id % 2 === 0 ? "-0.6deg" : "0.6deg";
  const dots = Array.from({length:16}).map(()=>`<div style="width:10px;height:10px;border-radius:9999px;background:${BG};"></div>`).join("");
  const chips = (e.work_types||[]).map(tp => `<span style="font-size:11px;padding:2px 10px;border-radius:9999px;background:rgba(242,100,48,0.12);color:#B84B22;border:1px solid rgba(242,100,48,0.3);">${esc(tt(WORK_TYPE_LABELS[tp] || [tp,tp]))}</span>`).join("");
  const deleteBtn = isForeman() ? `<button data-delete-id="${e.id}" style="margin-top:10px;width:100%;padding:7px 0;border-radius:8px;border:1px solid rgba(192,57,43,0.35);background:rgba(192,57,43,0.06);color:#C0392B;font-size:12px;">${t("deleteEntryBtn")}</button>` : "";

function hoursHTML() {
  const addBtn = `<button id="addHoursBtn" class="font-display" style="width:100%;padding:12px;border-radius:10px;background:${ORANGE};color:#fff;font-weight:600;letter-spacing:0.03em;border:none;font-size:13px;margin-bottom:4px;">${t("addHoursBtn")}</button>`;
  const searchBox = isForeman() ? `
    <input id="hoursSearchInput" type="text" value="${esc(state.hoursSearch)}" placeholder="${t("searchPh")}" style="width:100%;margin-top:12px;padding:10px 14px;border-radius:8px;border:none;background:${CARD};color:${INK};font-size:16px;box-sizing:border-box;" />` : "";

  let list = state.timeEntries;
  const q = state.hoursSearch.trim().toLowerCase();
  if (isForeman() && q) {
    list = list.filter(e => (e.author_name || "").toLowerCase().includes(q) || (e.author_email || "").toLowerCase().includes(q));
  }

  if (!list.length) return addBtn + searchBox + emptyStateHTML(t("emptyHours"));

  const months = {};
  list.forEach(e => { const monthKey = e.date.slice(0,7); (months[monthKey] = months[monthKey] || []).push(e); });
  const monthKeys = Object.keys(months).sort((a,b) => a < b ? 1 : -1);

  const monthsHTML = monthKeys.map(monthKey => {
    const entriesInMonth = months[monthKey];
    const [y, m] = monthKey.split("-").map(Number);
    const monthLabel = `${MONTHS_NOM[lang][m-1]} ${y}`;
    const monthTotal = entriesInMonth.reduce((sum, e) => sum + computeHoursMinutes(e), 0);

    const byWorker = {};
    entriesInMonth.forEach(e => { const key = e.author_name || e.author_email; (byWorker[key] = byWorker[key] || []).push(e); });
    const workerNames = Object.keys(byWorker).sort((a,b) => a.localeCompare(b, "uk"));

    const workersHTML = workerNames.map(name => {
      const wEntries = byWorker[name].sort((a,b) => a.date < b.date ? 1 : -1);
      const wTotal = wEntries.reduce((sum, e) => sum + computeHoursMinutes(e), 0);
      return `
        <div style="margin-top:14px;">
          ${isForeman() ? `<div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin-bottom:2px;">
            <span style="font-size:13px;font-weight:600;color:#fff;">${esc(name)}</span>
            <span class="font-mono" style="font-size:12px;color:${CYAN};opacity:0.8;">${minutesLabel(wTotal)}</span>
          </div>` : ""}
          <div class="tickets-grid">${wEntries.map(timeTicketHTML).join("")}</div>
        </div>`;
    }).join("");

    return `
      <div style="margin-top:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="font-mono" style="font-size:12px;text-transform:uppercase;color:${CYAN};opacity:0.8;">${monthLabel}</span>
          <span class="font-mono" style="font-size:12px;color:${ORANGE};font-weight:600;">${t("togetherLabel")}: ${minutesLabel(monthTotal)}</span>
        </div>
        ${workersHTML}
      </div>`;
  }).join("");

  return addBtn + searchBox + monthsHTML;
}

  let contentHTML = "";

    contentHTML = todayEntries.length === 0
      ? emptyStateHTML(t("emptyToday"))
      : `<div class="tickets-grid">${todayEntries.map(ticketHTML).join("")}</div>`;

          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${langToggleHTML()}
            <div style="width:36px;height:36px;border-radius:9999px;background:rgba(242,100,48,0.18);color:${ORANGE};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;" title="${esc(displayName())}">

      </div>

      <label class="font-mono" style="display:block;font-size:11px;text-transform:uppercase;opacity:0.5;margin-bottom:4px;">${t("fieldDate")}</label>
      <input id="fDate" type="date" value="${formState.date}" max="${todayISO()}" class="font-mono" style="width:100%;margin-bottom:16px;padding:10px 12px;border-radius:8px;border:1px solid rgba(26,26,24,0.15);font-size:14px;box-sizing:border-box;" />

      <label class="font-mono" style="display:block;font-size:11px;text-transform:uppercase;opacity:0.5;margin-bottom:4px;">${t("fieldSite")}</label>
      <input id="fSite" type="text" value="${esc(formState.site)}" placeholder="${t("sitePh")}" style="width:100%;margin-bottom:16px;padding:10px 12px;border-radius:8px;border:1px solid rgba(26,26,24,0.15);font-size:14px;box-sizing:border-box;" />

      <label class="font-mono" style="display:block;font-size:11px;text-transform:uppercase;opacity:0.5;margin-bottom:8px;">${t("fieldWeather")}</label>
      <div style="display:flex;gap:8px;margin-bottom:16px;">${weatherBtns}</div>

      <label class="font-mono" style="display:block;font-size:11px;text-transform:uppercase;opacity:0.5;margin-bottom:8px;">${t("fieldWorkTypes")}</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">${typeChips}</div>

      <label class="font-mono" style="display:block;font-size:11px;text-transform:uppercase;opacity:0.5;margin-bottom:4px;">${t("fieldWorkers")}</label>
      <input id="fWorkers" type="text" value="${esc(formState.workers)}" placeholder="${t("workersPh")}" style="width:100%;margin-bottom:16px;padding:10px 12px;border-radius:8px;border:1px solid rgba(26,26,24,0.15);font-size:14px;box-sizing:border-box;" />

      <label class="font-mono" style="display:block;font-size:11px;text-transform:uppercase;opacity:0.5;margin-bottom:4px;">${t("fieldDescription")}</label>
      <textarea id="fDesc" rows="4" placeholder="${t("descPh")}" style="width:100%;margin-bottom:8px;padding:10px 12px;border-radius:8px;border:1px solid rgba(26,26,24,0.15);font-size:14px;box-sizing:border-box;resize:none;">${esc(formState.description)}</textarea>

      ${state.formError ? `<div style="color:#C0392B;font-size:12px;margin-bottom:12px;">${state.formError}</div>` : ""}

      <button id="saveBtn" class="font-display" ${state.saving ? "disabled" : ""} style="width:100%;padding:12px;border-radius:8px;background:${ORANGE};color:#fff;font-weight:600;letter-spacing:0.03em;border:none;font-size:14px;margin-top:8px;opacity:${state.saving?0.6:1};">
        ${state.saving ? t("savingBtn") : t("saveEntryBtn")}
      </button>
    </div>
  </div>`;
}

function attachFormHandlers() {
  document.getElementById("backdrop").onclick = () => setState({ showForm: false });
  document.getElementById("closeForm").onclick = () => setState({ showForm: false });

  document.getElementById("fDate").onchange = (e) => formState.date = e.target.value;
  document.getElementById("fSite").oninput = (e) => formState.site = e.target.value;
  document.getElementById("fWorkers").oninput = (e) => formState.workers = e.target.value;
  document.getElementById("fDesc").oninput = (e) => formState.description = e.target.value;

  document.querySelectorAll("[data-weather]").forEach(btn => {
    btn.onclick = () => { formState.weather = btn.dataset.weather; render(); };
  });
  document.querySelectorAll("[data-type]").forEach(btn => {
    btn.onclick = () => {
      const tp = btn.dataset.type;
      formState.workTypes = formState.workTypes.includes(tp) ? formState.workTypes.filter(x=>x!==tp) : [...formState.workTypes, tp];
      render();
    };
  });

  document.getElementById("saveBtn").onclick = () => {
    if (!formState.site.trim() || !formState.description.trim()) { setState({ formError: t("fillRequired") }); return; }
    saveEntry({
      date: formState.date,
      site: formState.site.trim(),
      weather: formState.weather,
      work_types: formState.workTypes,
      workers: formState.workers.trim(),
      description: formState.description.trim(),
    });
    formState = { date: todayISO(), site: "", weather: "sun", workTypes: [], workers: "", description: "" };
  };
}

// ---- Старт ----
render();
initAuth();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
