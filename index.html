<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LinaroWorks — щоденник робіт</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16324F" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<style>
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; margin:0; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  /* ---- Адаптивна ширина контейнера ---- */
  .app-shell { max-width: 448px; margin: 0 auto; }
  @media (min-width: 768px)  { .app-shell { max-width: 720px; } }
  @media (min-width: 1024px) { .app-shell { max-width: 960px; } }
  @media (min-width: 1440px) { .app-shell { max-width: 1180px; } }

  /* ---- Сітка карток на широких екранах ---- */
  .tickets-grid { display: block; }
  @media (min-width: 768px) {
    .tickets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 16px; align-items: start; }
  }
  @media (min-width: 1280px) {
    .tickets-grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---- Безпечні зони (виїмка / індикатор Home на iPhone) ---- */
  .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .fab-safe { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .content-safe { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }

  /* ---- Дуже вузькі екрани (старі/малі телефони) ---- */
  @media (max-width: 359px) {
    .header-row { gap: 6px; }
    .app-title { font-size: 17px !important; }
  }

  /* ---- Заголовок не має обрізатись/налазити на вузьких екранах ---- */
  .header-row { flex-wrap: wrap; gap: 10px; row-gap: 8px; }
  .header-actions { flex-wrap: wrap; justify-content: flex-end; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
